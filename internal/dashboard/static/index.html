<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cache-Pot</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='11' rx='8' ry='1.6' fill='%23e0923f'/%3E%3Cpath d='M9.5 13c.5 6 3 9.5 6.5 9.5s6-3.5 6.5-9.5z' fill='%23c97a3a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<div class="app">
  <nav class="sidebar" aria-label="Main">
    <div class="brand">
      <svg class="brand-pot" width="16" height="16" viewBox="0 0 32 32" aria-hidden="true">
        <ellipse cx="16" cy="11" rx="8" ry="1.6" fill="var(--accent)"/>
        <path d="M9.5 13c.5 6 3 9.5 6.5 9.5s6-3.5 6.5-9.5z" fill="var(--accent-dim)"/>
      </svg>
      <span class="brand-text">
        <span class="brand-mark">CACHE<span class="brand-dot">·</span>POT</span>
        <span class="brand-sub">console</span>
      </span>
    </div>
    <ul class="nav" id="nav">
      <li><a href="#/overview" data-page="overview"><span class="nav-glyph">◱</span>overview</a></li>
      <li><a href="#/browser" data-page="browser"><span class="nav-glyph">⌸</span>browser</a></li>
      <li><a href="#/workbench" data-page="workbench"><span class="nav-glyph">❯_</span>workbench</a></li>
      <li><a href="#/profiler" data-page="profiler"><span class="nav-glyph">◉</span>profiler</a></li>
      <li><a href="#/slowlog" data-page="slowlog"><span class="nav-glyph">◷</span>slowlog</a></li>
      <li><a href="#/pubsub" data-page="pubsub"><span class="nav-glyph">⇄</span>pub/sub</a></li>
      <li><a href="#/analysis" data-page="analysis"><span class="nav-glyph">▤</span>analysis</a></li>
      <li><a href="#/clients" data-page="clients"><span class="nav-glyph">⌗</span>clients</a></li>
    </ul>
    <div class="sidebar-foot">
      <span class="status-dot" id="conn-dot" title="dashboard connection"></span>
      <span id="conn-label" class="muted">connecting…</span>
      <span class="version muted" id="version"></span>
    </div>
  </nav>
  <main class="view" id="view" tabindex="-1"></main>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
